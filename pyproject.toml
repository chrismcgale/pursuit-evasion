[project]
name = "pursuit-evasion"
version = "0.1.0"
description = "2v2 3D pursuit-evasion: self-play RL policies gated by a py_trees behaviour tree"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=0.29",
    "mujoco>=3.1",
    "stable-baselines3>=2.3",
    "py_trees>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "torch>=2.7",
    "tensorboard>=2.16",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "onnxruntime>=1.29.0",
]

[project.scripts]
pe-train = "pursuit_evasion.train.train_ppo:main"
pe-eval = "pursuit_evasion.eval.evaluate:main"
pe-games = "pursuit_evasion.eval.games:main"
pe-viz = "pursuit_evasion.eval.viz:main"
pe-parity = "pursuit_evasion.eval.parity:main"
pe-ablate = "pursuit_evasion.eval.ablation:main"
pe-trace = "pursuit_evasion.eval.trace:main"
pe-explore = "pursuit_evasion.eval.explorer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pursuit_evasion"]

# CPU torch by default: avoids CUDA-wheel mismatch on Blackwell (sm_120).
# To use the GPU, delete the two blocks below and reinstall with cu128 wheels:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu128
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
